<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ad Exchange on Blockchain</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.container{max-width:900px;width:100%;text-align:center}
h1{font-size:2.5rem;margin-bottom:12px}
h1 span{background:linear-gradient(135deg,#00d4ff,#7b2ff7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
p.sub{color:rgba(255,255,255,.6);margin-bottom:48px;font-size:1.1rem}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.role{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:32px 24px;cursor:pointer;transition:all .3s;text-decoration:none;color:#fff;display:block}
.role:hover{transform:translateY(-4px);border-color:#00d4ff;box-shadow:0 12px 30px rgba(0,212,255,.2)}
.role .icon{font-size:3rem;margin-bottom:16px}
.role h2{font-size:1.3rem;margin-bottom:8px}
.role p{color:rgba(255,255,255,.6);font-size:.9rem}
</style>
</head>
<body>
<div class="container">
<h1>🎯 Ad Exchange <span>on Blockchain</span></h1>
<p class="sub">Decentralized advertising exchange — advertisers pay viewers for watching ads</p>
<div class="roles">
<a class="role" href="advertiser.html">
<div class="icon">📢</div>
<h2>Advertiser</h2>
<p>Create campaigns, set tier rates, fund rewards</p>
</a>
<a class="role" href="blogger.html">
<div class="icon">🎬</div>
<h2>Blogger</h2>
<p>Promote your YouTube videos, attach content</p>
</a>
<a class="role" href="viewer.html">
<div class="icon">👀</div>
<h2>Viewer</h2>
<p>Watch ads, earn rewards per second</p>
</a>
</div>
</div>
</body>
</html>
