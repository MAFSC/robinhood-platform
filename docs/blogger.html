<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blogger — Ad Exchange</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);color:#fff;min-height:100vh;padding:20px}
.container{max-width:900px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:24px}
h1{font-size:1.5rem}
h1 span{color:#00d4ff}
a.back{color:rgba(255,255,255,.5);text-decoration:none;font-size:.9rem}
a.back:hover{color:#fff}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:24px;margin-bottom:20px}
.card h2{font-size:1.2rem;color:#00d4ff;margin-bottom:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:.85rem;color:rgba(255,255,255,.7);margin-bottom:6px}
.field input{width:100%;padding:10px 14px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.15);border-radius:8px;color:#fff;font-size:.95rem}
.field input:focus{outline:none;border-color:#00d4ff}
.btn{padding:12px 24px;border:none;border-radius:8px;cursor:pointer;font-size:1rem;font-weight:600;transition:all .3s;width:100%;margin-bottom:8px}
.btn-primary{background:linear-gradient(135deg,#00d4ff,#7b2ff7);color:#fff}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,212,255,.4)}
.btn-secondary{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2)}
.status{padding:12px;border-radius:8px;font-size:.85rem;margin-top:12px;word-break:break-all}
.status.success{background:rgba(0,255,100,.1);color:#4ade80;border:1px solid rgba(0,255,100,.3)}
.status.error{background:rgba(255,0,0,.1);color:#f87171;border:1px solid rgba(255,0,0,.3)}
.status.info{background:rgba(0,212,255,.1);color:#00d4ff;border:1px solid rgba(0,212,255,.3)}
.wallet{font-size:.85rem;color:rgba(255,255,255,.6)}
.wallet code{background:rgba(0,0,0,.4);padding:2px 6px;border-radius:4px;font-family:monospace}
.info{background:rgba(0,212,255,.1);border:1px solid rgba(0,212,255,.3);padding:12px;border-radius:8px;font-size:.85rem;margin-bottom:16px;color:#00d4ff}
.campaign{padding:12px;background:rgba(0,0,0,.2);border-radius:8px;margin-bottom:8px;font-size:.85rem}
.campaign a{color:#00d4ff;text-decoration:none}
.preview{width:100%;aspect-ratio:16/9;background:#000;border-radius:8px;margin-bottom:12px;border:0}
</style>
</head>
<body>
<div class="container">
<header>
<h1>🎬 Blogger <span>Panel</span></h1>
<a class="back" href="index.html">← Back</a>
</header>

<div class="card" id="connectCard">
<h2>Connect Wallet</h2>
<button id="connectBtn" class="btn btn-primary">Connect MetaMask</button>
</div>

<div class="card" id="walletPanel" style="display:none">
<h2>Wallet</h2>
<div class="wallet">
Address: <code id="walletAddress">-</code><br>
Chain ID: <code id="chainId">-</code><br>
Balance: <code id="balance">-</code> ETH
</div>
<button id="switchNetworkBtn" class="btn btn-secondary" style="margin-top:12px">Switch to Robinhood Testnet</button>
<button id="refreshBtn" class="btn btn-secondary">Refresh</button>
</div>

<div class="card" id="createCard" style="display:none">
<h2>Promote Your Video</h2>
<div class="info">📺 Paste a YouTube link. Viewers will watch it in an embedded player and earn rewards for their attention.</div>
<div class="field"><label>Video Title</label><input id="title" placeholder="My awesome video"></div>
<div class="field"><label>YouTube URL</label><input id="contentURI" placeholder="https://www.youtube.com/watch?v=..." oninput="updatePreview()"></div>
<iframe id="preview" class="preview" style="display:none" allowfullscreen></iframe>
<div class="field"><label>Total Budget (axUSDG)</label><input type="number" id="budget" value="10" step="0.1"></div>
<div class="field"><label>Tier 1 Rate (per second) — first viewers earn more</label><input type="number" id="tier1Rate" value="0.01" step="0.001"></div>
<div class="field"><label>Tier 2 Rate (per second) — rest of viewers</label><input type="number" id="tier2Rate" value="0.001" step="0.0001"></div>
<div class="field"><label>Tier 1 Limit (number of viewers)</label><input type="number" id="tier1Limit" value="100"></div>
<div class="field"><label>Duration (seconds)</label><input type="number" id="duration" value="86400"></div>
<button id="approveBtn" class="btn btn-secondary">1. Approve axUSDG</button>
<button id="createBtn" class="btn btn-primary">2. Launch Campaign</button>
<div id="createStatus"></div>
</div>

<div class="card" id="myCampaignsCard" style="display:none">
<h2>My Campaigns</h2>
<button id="loadBtn" class="btn btn-secondary">Load My Campaigns</button>
<div id="myList" style="margin-top:12px"></div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
<script>
const CONFIG = {
  CHAIN_ID_HEX: '0xB646',
  CHAIN_NAME: 'Robinhood Chain Testnet',
  RPC_URL: 'https://rpc.testnet.chain.robinhood.com',
  EXPLORER: 'https://explorer.testnet.chain.robinhood.com',
  CONTRACTS: {
    TOKEN:    '0x6400f658357751ab22B9Bb3C1101532C91cfCb94',
    FLOW:     '0xbEeFed3671D12250cF77765203f52E0FCD1aB1F6',
    REGISTRY: '0x493A40368E6B6E95479ef07f1a6bD70EB65216A8',
    MANAGER:  '0x99856EA3b8b31cF4dA170ca05F48D6468C8E3e1e'
  }
};
const TOKEN_ABI = [
  'function approve(address spender, uint256 amount) returns (bool)',
  'function balanceOf(address) view returns (uint256)'
];
const MANAGER_ABI = [
  'function createCampaign(string title, string contentURI, uint128 totalBudget, uint128 tier1Rate, uint128 tier2Rate, uint32 tier1Limit, uint40 duration) returns (uint256)',
  'function getAdvertiserCampaigns(address advertiser) view returns (uint256[])',
  'function getCampaign(uint256 campaignId) view returns (tuple(address advertiser, address token, string contentURI, string title, uint128 totalBudget, uint128 spentBudget, uint128 tier1Rate, uint128 tier2Rate, uint32 tier1Limit, uint32 tier1Count, uint32 totalViewers, uint40 createdAt, uint40 expiresAt, bool isActive))'
];

let provider, signer, account, tokenContract, managerContract;
function log(id,msg,type){const el=document.getElementById(id);if(el){el.className='status '+type;el.textContent=msg}}
function pu(v,d=6){return ethers.parseUnits(v.toString(),d)}
function fu(v,d=6){return ethers.formatUnits(v,d)}

function ytEmbed(url){
  if(!url) return null;
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/))([A-Za-z0-9_-]{11})/);
  return m ? 'https://www.youtube.com/embed/' + m[1] : null;
}
function updatePreview(){
  const url = document.getElementById('contentURI').value;
  const embed = ytEmbed(url);
  const iframe = document.getElementById('preview');
  if(embed){
    iframe.src = embed;
    iframe.style.display = 'block';
  } else {
    iframe.style.display = 'none';
  }
}

async function connect(){
  if(!window.ethereum){alert('Install MetaMask');return}
  provider=new ethers.BrowserProvider(window.ethereum);
  const a=await provider.send('eth_requestAccounts',[]);
  account=a[0];
  signer=await provider.getSigner();
  tokenContract=new ethers.Contract(CONFIG.CONTRACTS.TOKEN,TOKEN_ABI,signer);
  managerContract=new ethers.Contract(CONFIG.CONTRACTS.MANAGER,MANAGER_ABI,signer);
  document.getElementById('connectCard').style.display='none';
  document.getElementById('walletPanel').style.display='block';
  document.getElementById('createCard').style.display='block';
  document.getElementById('myCampaignsCard').style.display='block';
  document.getElementById('walletAddress').textContent=account;
  const net=await provider.getNetwork();
  document.getElementById('chainId').textContent=net.chainId;
  await refreshBalance();
}
async function refreshBalance(){
  if(!provider||!account)return;
  const b=await provider.getBalance(account);
  document.getElementById('balance').textContent=ethers.formatEther(b);
}
async function switchNetwork(){
  try{
    await window.ethereum.request({method:'wallet_switchEthereumChain',params:[{chainId:CONFIG.CHAIN_ID_HEX}]});
  }catch(e){
    if(e.code===4902){
      await window.ethereum.request({method:'wallet_addEthereumChain',params:[{
        chainId:CONFIG.CHAIN_ID_HEX,chainName:CONFIG.CHAIN_NAME,
        nativeCurrency:{name:'ETH',symbol:'ETH',decimals:18},
        rpcUrls:[CONFIG.RPC_URL],blockExplorerUrls:[CONFIG.EXPLORER]
      }]});
    }
  }
}
async function approve(){
  try{
    log('createStatus','Approving...','info');
    const b=pu(document.getElementById('budget').value);
    const tx=await tokenContract.approve(CONFIG.CONTRACTS.MANAGER,b);
    await tx.wait();
    log('createStatus','Approved: '+tx.hash,'success');
  }catch(e){log('createStatus','Error: '+e.message,'error')}
}
async function create(){
  try{
    const uri = document.getElementById('contentURI').value;
    if(!ytEmbed(uri)){
      log('createStatus','Please enter a valid YouTube URL','error');
      return;
    }
    log('createStatus','Launching...','info');
    const title=document.getElementById('title').value;
    const b=pu(document.getElementById('budget').value);
    const r1=pu(document.getElementById('tier1Rate').value);
    const r2=pu(document.getElementById('tier2Rate').value);
    const lim=parseInt(document.getElementById('tier1Limit').value);
    const dur=parseInt(document.getElementById('duration').value);
    const tx=await managerContract.createCampaign(title,uri,b,r1,r2,lim,dur);
    await tx.wait();
    log('createStatus','Campaign launched: '+tx.hash,'success');
  }catch(e){log('createStatus','Error: '+e.message,'error')}
}
async function loadMine(){
  try{
    const ids=await managerContract.getAdvertiserCampaigns(account);
    const list=document.getElementById('myList');
    list.innerHTML='';
    if(ids.length===0){list.innerHTML='<p style="color:rgba(255,255,255,.5)">No campaigns yet</p>';return}
    for(const id of ids){
      const c=await managerContract.getCampaign(id);
      const embed = ytEmbed(c.contentURI);
      const div=document.createElement('div');
      div.className='campaign';
      div.innerHTML='<b>#'+id+' — '+c.title+'</b><br>'+
        (embed ? '<a href="'+c.contentURI+'" target="_blank">'+c.contentURI+'</a>' : c.contentURI)+
        '<br>Budget: '+fu(c.totalBudget)+' | Spent: '+fu(c.spentBudget)+' | Viewers: '+c.totalViewers+' | Active: '+c.isActive;
      list.appendChild(div);
    }
  }catch(e){alert('Error: '+e.message)}
}
document.getElementById('connectBtn').addEventListener('click',connect);
document.getElementById('switchNetworkBtn').addEventListener('click',switchNetwork);
document.getElementById('refreshBtn').addEventListener('click',refreshBalance);
document.getElementById('approveBtn').addEventListener('click',approve);
document.getElementById('createBtn').addEventListener('click',create);
document.getElementById('loadBtn').addEventListener('click',loadMine);
</script>
</body>
</html>
