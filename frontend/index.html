<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ad Exchange on Blockchain</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 30px;
        }
        h1 { font-size: 1.8rem; }
        h1 span { color: #00d4ff; }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #00d4ff, #7b2ff7);
            color: #fff;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,212,255,0.4); }
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.2); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 24px;
        }
        .card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(10px);
        }
        .card h2 {
            font-size: 1.2rem;
            margin-bottom: 16px;
            color: #00d4ff;
        }
        .field { margin-bottom: 16px; }
        .field label {
            display: block;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.7);
            margin-bottom: 6px;
        }
        .field input {
            width: 100%;
            padding: 10px 14px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
        }
        .field input:focus {
            outline: none;
            border-color: #00d4ff;
        }
        .status {
            padding: 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-top: 12px;
            word-break: break-all;
        }
        .status.success { background: rgba(0,255,100,0.1); color: #4ade80; border: 1px solid rgba(0,255,100,0.3); }
        .status.error { background: rgba(255,0,0,0.1); color: #f87171; border: 1px solid rgba(255,0,0,0.3); }
        .status.info { background: rgba(0,212,255,0.1); color: #00d4ff; border: 1px solid rgba(0,212,255,0.3); }
        .wallet-info {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.6);
            margin-top: 8px;
        }
        .wallet-info code {
            background: rgba(0,0,0,0.4);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
        }
        .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
        .actions .btn { flex: 1; min-width: 120px; }
        #log {
            font-family: monospace;
            font-size: 0.8rem;
            max-height: 200px;
            overflow-y: auto;
            background: rgba(0,0,0,0.4);
            padding: 12px;
            border-radius: 8px;
            margin-top: 12px;
        }
        #log div { margin-bottom: 4px; }
        #log .log-info { color: #00d4ff; }
        #log .log-success { color: #4ade80; }
        #log .log-error { color: #f87171; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎯 Ad Exchange <span>on Blockchain</span></h1>
            <div>
                <button id="connectBtn" class="btn btn-primary">Connect MetaMask</button>
            </div>
        </header>

        <div id="walletPanel" style="display:none;" class="card" style="margin-bottom:24px;">
            <h2>Wallet</h2>
            <div class="wallet-info">
                Address: <code id="walletAddress">-</code><br>
                Chain ID: <code id="chainId">-</code><br>
                Balance: <code id="balance">-</code> ETH
            </div>
            <div class="actions">
                <button id="switchNetworkBtn" class="btn btn-secondary">Switch to Robinhood Testnet</button>
                <button id="refreshBtn" class="btn btn-secondary">Refresh</button>
            </div>
        </div>

        <div class="grid" id="mainGrid" style="display:none;">
            <!-- Advertiser Panel -->
            <div class="card">
                <h2>📢 Advertiser: Create Campaign</h2>
                <div class="field">
                    <label>Total Budget (axUSDG, e.g. 10)</label>
                    <input type="number" id="campaignBudget" value="10" step="0.1">
                </div>
                <div class="field">
                    <label>Tier 1 Rate (per second, e.g. 0.01)</label>
                    <input type="number" id="tier1Rate" value="0.01" step="0.001">
                </div>
                <div class="field">
                    <label>Tier 2 Rate (per second, e.g. 0.001)</label>
                    <input type="number" id="tier2Rate" value="0.001" step="0.0001">
                </div>
                <div class="field">
                    <label>Tier 1 Limit (viewers)</label>
                    <input type="number" id="tier1Limit" value="100">
                </div>
                <div class="field">
                    <label>Duration (seconds)</label>
                    <input type="number" id="campaignDuration" value="86400">
                </div>
                <button id="approveBtn" class="btn btn-secondary" style="width:100%; margin-bottom:8px;">1. Approve axUSDG</button>
                <button id="createCampaignBtn" class="btn btn-primary" style="width:100%;">2. Create Campaign</button>
                <div id="campaignStatus"></div>
            </div>

            <!-- Viewer Panel -->
            <div class="card">
                <h2>👀 Viewer: Join Campaign</h2>
                <div class="field">
                    <label>Campaign ID</label>
                    <input type="number" id="joinCampaignId" value="1">
                </div>
                <button id="joinCampaignBtn" class="btn btn-primary" style="width:100%; margin-bottom:8px;">Join Campaign</button>
                <div class="field">
                    <label>Session ID (after joining)</label>
                    <input type="number" id="sessionId" placeholder="e.g. 1">
                </div>
                <div class="actions">
                    <button id="resumeBtn" class="btn btn-secondary">▶ Resume</button>
                    <button id="pauseBtn" class="btn btn-secondary">⏸ Pause</button>
                </div>
                <button id="withdrawBtn" class="btn btn-primary" style="width:100%; margin-top:8px;">💰 Withdraw Rewards</button>
                <button id="checkRewardBtn" class="btn btn-secondary" style="width:100%; margin-top:8px;">Check Withdrawable</button>
                <div id="viewerStatus"></div>
            </div>

            <!-- Info Panel -->
            <div class="card">
                <h2>ℹ️ Contract Info</h2>
                <div class="wallet-info">
                    <div>Manager: <code id="managerAddr">-</code></div>
                    <div>Token: <code id="tokenAddr">-</code></div>
                    <div>Registry: <code id="registryAddr">-</code></div>
                </div>
                <div id="log"></div>
            </div>
        </div>
    </div>

    <script>
        // ============ CONFIG ============
        const CONFIG = {
            CHAIN_ID: 46630,
            CHAIN_ID_HEX: '0xB646',
            CHAIN_NAME: 'Robinhood Chain Testnet',
            RPC_URL: 'https://rpc.testnet.chain.robinhood.com',
            EXPLORER: 'https://explorer.testnet.chain.robinhood.com',
            CONTRACTS: {
                TOKEN:    '0xceC312921CaaaBa9b8091F1eb18FeedC529Fe9EC',
                FLOW:     '0x9b4e9f5A3E4aC4877CA3C77C14a16884C75D98a7',
                REGISTRY: '0x614A438473815A077AA3809Ab8ed035280Cd0675',
                MANAGER:  '0xa8d30976b3084Ad559C6C53CC3c3E608013Ee1f7',
            }
        };

        // ============ ABIs ============
        const TOKEN_ABI = [
            'function approve(address spender, uint256 amount) returns (bool)',
            'function balanceOf(address) view returns (uint256)',
            'function decimals() view returns (uint8)',
            'function allowance(address owner, address spender) view returns (uint256)',
        ];

        const MANAGER_ABI = [
            'function createCampaign(uint128 totalBudget, uint128 tier1Rate, uint128 tier2Rate, uint32 tier1Limit, uint40 duration) returns (uint256)',
            'function joinCampaign(uint256 campaignId) returns (uint256)',
            'function resumeViewing(uint256 sessionId)',
            'function pauseViewing(uint256 sessionId)',
            'function withdrawRewards(uint256 sessionId)',
            'function getWithdrawableAmount(uint256 sessionId) view returns (uint128)',
            'function getSession(uint256 sessionId) view returns (tuple(uint256 campaignId, uint256 streamId, address viewer, uint128 ratePerSecond, uint40 startedAt, uint40 lastUpdateAt, uint128 earned, bool isActive))',
            'function getCampaign(uint256 campaignId) view returns (tuple(address advertiser, address token, uint128 totalBudget, uint128 spentBudget, uint128 tier1Rate, uint128 tier2Rate, uint32 tier1Limit, uint32 tier1Count, uint32 totalViewers, uint40 createdAt, uint40 expiresAt, bool isActive))',
            'function nextCampaignId() view returns (uint256)',
            'function nextSessionId() view returns (uint256)',
        ];

        // ============ STATE ============
        let provider, signer, account, chainId;
        let tokenContract, managerContract;

        // ============ HELPERS ============
        function log(msg, type = 'info') {
            const logEl = document.getElementById('log');
            const div = document.createElement('div');
            div.className = `log-${type}`;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logEl.prepend(div);
        }

        function setStatus(elId, msg, type) {
            const el = document.getElementById(elId);
            if (!el) return;
            el.className = `status ${type}`;
            el.textContent = msg;
        }

        function parseUnits(value, decimals = 6) {
            return ethers.parseUnits(value.toString(), decimals);
        }

        function formatUnits(value, decimals = 6) {
            return ethers.formatUnits(value, decimals);
        }

        // ============ WALLET ============
        async function connectWallet() {
            if (!window.ethereum) {
                alert('MetaMask not detected. Please install MetaMask.');
                return;
            }

            try {
                provider = new ethers.BrowserProvider(window.ethereum);
                const accounts = await provider.send('eth_requestAccounts', []);
                account = accounts[0];

                signer = await provider.getSigner();
                chainId = (await provider.getNetwork()).chainId;

                tokenContract = new ethers.Contract(CONFIG.CONTRACTS.TOKEN, TOKEN_ABI, signer);
                managerContract = new ethers.Contract(CONFIG.CONTRACTS.MANAGER, MANAGER_ABI, signer);

                document.getElementById('connectBtn').textContent = 'Connected';
                document.getElementById('connectBtn').disabled = true;
                document.getElementById('walletPanel').style.display = 'block';
                document.getElementById('mainGrid').style.display = 'grid';
                document.getElementById('walletAddress').textContent = account;
                document.getElementById('chainId').textContent = chainId;
                document.getElementById('managerAddr').textContent = CONFIG.CONTRACTS.MANAGER;
                document.getElementById('tokenAddr').textContent = CONFIG.CONTRACTS.TOKEN;
                document.getElementById('registryAddr').textContent = CONFIG.CONTRACTS.REGISTRY;

                await refreshBalance();
                log(`Connected: ${account}`, 'success');

                window.ethereum.on('accountsChanged', (accs) => {
                    if (accs.length === 0) location.reload();
                    else location.reload();
                });
                window.ethereum.on('chainChanged', () => location.reload());
            } catch (err) {
                log(`Connection failed: ${err.message}`, 'error');
            }
        }

        async function refreshBalance() {
            if (!provider || !account) return;
            const bal = await provider.getBalance(account);
            document.getElementById('balance').textContent = ethers.formatEther(bal);
        }

        async function switchNetwork() {
            try {
                await window.ethereum.request({
                    method: 'wallet_switchEthereumChain',
                    params: [{ chainId: CONFIG.CHAIN_ID_HEX }],
                });
            } catch (err) {
                if (err.code === 4902) {
                    await window.ethereum.request({
                        method: 'wallet_addEthereumChain',
                        params: [{
                            chainId: CONFIG.CHAIN_ID_HEX,
                            chainName: CONFIG.CHAIN_NAME,
                            nativeCurrency: { name: 'ETH', symbol: 'ETH', decimals: 18 },
                            rpcUrls: [CONFIG.RPC_URL],
                            blockExplorerUrls: [CONFIG.EXPLORER],
                        }],
                    });
                } else {
                    log(`Switch failed: ${err.message}`, 'error');
                }
            }
        }

        // ============ ADVERTISER ============
        async function approveToken() {
            try {
                const budget = parseUnits(document.getElementById('campaignBudget').value);
                setStatus('campaignStatus', 'Approving...', 'info');
                const tx = await tokenContract.approve(CONFIG.CONTRACTS.MANAGER, budget);
                await tx.wait();
                setStatus('campaignStatus', `Approved: ${tx.hash}`, 'success');
                log(`Approve success: ${tx.hash}`, 'success');
            } catch (err) {
                setStatus('campaignStatus', `Error: ${err.message}`, 'error');
                log(`Approve failed: ${err.message}`, 'error');
            }
        }

        async function createCampaign() {
            try {
                const budget = parseUnits(document.getElementById('campaignBudget').value);
                const tier1Rate = parseUnits(document.getElementById('tier1Rate').value);
                const tier2Rate = parseUnits(document.getElementById('tier2Rate').value);
                const tier1Limit = parseInt(document.getElementById('tier1Limit').value);
                const duration = parseInt(document.getElementById('campaignDuration').value);

                setStatus('campaignStatus', 'Creating campaign...', 'info');
                const tx = await managerContract.createCampaign(
                    budget, tier1Rate, tier2Rate, tier1Limit, duration
                );
                const receipt = await tx.wait();
                setStatus('campaignStatus', `Campaign created: ${tx.hash}`, 'success');
                log(`Campaign created: ${tx.hash}`, 'success');
            } catch (err) {
                setStatus('campaignStatus', `Error: ${err.message}`, 'error');
                log(`Create failed: ${err.message}`, 'error');
            }
        }

        // ============ VIEWER ============
        async function joinCampaign() {
            try {
                const campaignId = parseInt(document.getElementById('joinCampaignId').value);
                setStatus('viewerStatus', 'Joining campaign...', 'info');
                const tx = await managerContract.joinCampaign(campaignId);
                const receipt = await tx.wait();

                // Try to parse sessionId from events
                const nextId = await managerContract.nextSessionId();
                const sessionId = Number(nextId) - 1;
                document.getElementById('sessionId').value = sessionId;

                setStatus('viewerStatus', `Joined! Session ID: ${sessionId}. Tx: ${tx.hash}`, 'success');
                log(`Joined campaign ${campaignId}, session ${sessionId}`, 'success');
            } catch (err) {
                setStatus('viewerStatus', `Error: ${err.message}`, 'error');
                log(`Join failed: ${err.message}`, 'error');
            }
        }

        async function resumeViewing() {
            try {
                const sessionId = parseInt(document.getElementById('sessionId').value);
                setStatus('viewerStatus', 'Resuming...', 'info');
                const tx = await managerContract.resumeViewing(sessionId);
                await tx.wait();
                setStatus('viewerStatus', `Resumed: ${tx.hash}`, 'success');
                log(`Resumed session ${sessionId}`, 'success');
            } catch (err) {
                setStatus('viewerStatus', `Error: ${err.message}`, 'error');
                log(`Resume failed: ${err.message}`, 'error');
            }
        }

        async function pauseViewing() {
            try {
                const sessionId = parseInt(document.getElementById('sessionId').value);
                setStatus('viewerStatus', 'Pausing...', 'info');
                const tx = await managerContract.pauseViewing(sessionId);
                await tx.wait();
                setStatus('viewerStatus', `Paused: ${tx.hash}`, 'success');
                log(`Paused session ${sessionId}`, 'success');
            } catch (err) {
                setStatus('viewerStatus', `Error: ${err.message}`, 'error');
                log(`Pause failed: ${err.message}`, 'error');
            }
        }

        async function withdrawRewards() {
            try {
                const sessionId = parseInt(document.getElementById('sessionId').value);
                setStatus('viewerStatus', 'Withdrawing...', 'info');
                const tx = await managerContract.withdrawRewards(sessionId);
                await tx.wait();
                setStatus('viewerStatus', `Withdrawn: ${tx.hash}`, 'success');
                log(`Withdrawn from session ${sessionId}`, 'success');
                await refreshBalance();
            } catch (err) {
                setStatus('viewerStatus', `Error: ${err.message}`, 'error');
                log(`Withdraw failed: ${err.message}`, 'error');
            }
        }

        async function checkReward() {
            try {
                const sessionId = parseInt(document.getElementById('sessionId').value);
                const amount = await managerContract.getWithdrawableAmount(sessionId);
                const formatted = formatUnits(amount);
                setStatus('viewerStatus', `Withdrawable: ${formatted} axUSDG`, 'info');
                log(`Session ${sessionId}: ${formatted} axUSDG`, 'info');
            } catch (err) {
                setStatus('viewerStatus', `Error: ${err.message}`, 'error');
                log(`Check failed: ${err.message}`, 'error');
            }
        }

        // ============ INIT ============
        document.getElementById('connectBtn').addEventListener('click', connectWallet);
        document.getElementById('switchNetworkBtn').addEventListener('click', switchNetwork);
        document.getElementById('refreshBtn').addEventListener('click', refreshBalance);
        document.getElementById('approveBtn').addEventListener('click', approveToken);
        document.getElementById('createCampaignBtn').addEventListener('click', createCampaign);
        document.getElementById('joinCampaignBtn').addEventListener('click', joinCampaign);
        document.getElementById('resumeBtn').addEventListener('click', resumeViewing);
        document.getElementById('pauseBtn').addEventListener('click', pauseViewing);
        document.getElementById('withdrawBtn').addEventListener('click', withdrawRewards);
        document.getElementById('checkRewardBtn').addEventListener('click', checkReward);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
</body>
</html>
